<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minha Loja</title>
</head>
<body>

  <center><h1>Vai um Açaí aí?</h1></center>

  <form action="index.html" method="post">
    <fieldset>
      <legend>Açaí de 300ml</legend>
      <p>Preço: R$ 12,00</p>
      <label for="qtd1">Quantidade:</label>
      <input type="number" id="qtd1" name="qtd_acai" min="0" value="0">
      <br><br>
      <input type="submit" name="comprar1" value="Comprar Açaí">
    </fieldset><br>

    <fieldset>
      <legend>Açaí de 500ml</legend>
      <p>Preço: R$ 15,00</p>
      <label for="qtd2">Quantidade:</label>
      <input type="number" id="qtd2" name="qtd_acai500" min="0" value="0">
      <br><br>
      <input type="submit" name="comprar2" value="Comprar Açaí 500ml">
    <br>
    </fieldset><br>

    <fieldset>
      <legend>Dados para Entrega</legend>
      <label for="nome">Nome:</label>
      <br>
      <input type="text" id="nome" name="nome"><br>
      <label for="email">E-mail:</label>
      <br>
      <input type="email" id="email" name="email"><br>
      <label for="endereco">Endereço:</label>
      <br>
      <input type="text" id="endereco" name="endereco"><br>
      <label for="celular">Celular:</label>
      <br>
      <input type="tel" id="celular" name="celular"><br>
    </fieldset><br>

    <input type="submit" value="Finalizar Pedido">
    
    </form>

</body>
</html>
